      Every section is scaled by the same factor, which leaves the beats and
      their order exactly as they are and only shortens the distance between

      Pointer-based devices keep the desktop runway untouched. ── */

/* ── the reference's signature move: words arrive one at a time and the

      measured widths, so the line can breathe instead of jumping. ── */

/* ═══ S1 · the invoices ═════════════════════════════════════════════

   const d=E('div','inv',st);

 });

/* ═══ S2 · the two lines ════════════════════════════════════════════
   The whole argument as one chart: a metered bill claws upward and
   spikes; ours is a straight line you can put in a budget. */
{
 const s=sec(280), st=s.stage;
 const pl=plate2(st,'silk',1,
   'linear-gradient(180deg,rgba(253,252,255,.92),rgba(253,252,255,.80))');
 const headBox=E('div','',st);
 px(headBox,{position:'absolute',left:'0',right:'0',top:'19%',height:'0'});
 const a=line(headBox,'Ours is a *straight line*.','t-hero');
 const ch=E('div','chart',st);
 const NS='http://www.w3.org/2000/svg';
 const svg=document.createElementNS(NS,'svg'); ch.appendChild(svg);
 const mk=(t,cls)=>{const e=document.createElementNS(NS,t); e.setAttribute('class',cls);
   svg.appendChild(e); return e;};
 const rules=[]; for(let i=0;i<=4;i++) rules.push(mk('line','grid'));
 const jag=mk('path','jag'), flat=mk('path','flat');
 /* fractions of the plot box; resolved to pixels each draw so the stroke
    keeps a true width at every viewport */
 const JAGY=[.92,.78,.85,.58,.67,.36,.47,.16,.27,.03];
 const FLATY=.74;
 function geometry(cw,chh){
   svg.setAttribute('viewBox',`0 0 ${cw} ${chh}`);
   svg.setAttribute('width',cw); svg.setAttribute('height',chh);
   rules.forEach((g,i)=>{
     const y=(chh/4)*i;
     g.setAttribute('x1',0); g.setAttribute('x2',cw);
     g.setAttribute('y1',y); g.setAttribute('y2',y);
   });
   jag.setAttribute('d', JAGY.map((v,i)=>
     `${i?'L':'M'}${(cw*i/(JAGY.length-1)).toFixed(1)} ${(chh*v).toFixed(1)}`).join(' '));
   flat.setAttribute('d',`M0 ${(chh*FLATY).toFixed(1)} L${cw} ${(chh*FLATY).toFixed(1)}`);
 }
 const l1=E('div','clab',st,'metered API'); px(l1,{color:'var(--amber)'});
 const l2=E('div','clab',st,'50 OMR · flat'); px(l2,{color:'var(--pur)'});
 s.draw=p=>{
   show(a,p,.03,.05,.18,{out:.985,outDur:.05});
   const w=VW(), h=VH(), nb=NARROW();
   const cwid=Math.min(w*(nb?.86:.66),980), chgt=Math.min(h*.34,320);
   const cl=(w-cwid)/2, ct=h*(nb?.44:.46);
   px(ch,{left:cl+'px',top:ct+'px',width:cwid+'px',height:chgt+'px',
     opacity:(eo3(P(p,.16,.16))*(1-eo3(P(p,.985,.05)))).toFixed(3)});
   geometry(cwid,chgt);
   const fs=Math.max(2.5,Math.min(5,cwid*.0042));
   jag.style.strokeWidth=fs; flat.style.strokeWidth=fs;
   /* both lines draw left to right, the metered one first */
   const dj=jag.getTotalLength()||600, df=flat.getTotalLength()||cwid;
   const uj=eio(P(p,.22,.32)), uf=eio(P(p,.54,.28));
   jag.style.strokeDasharray=dj; jag.style.strokeDashoffset=(dj*(1-uj)).toFixed(2);
   flat.style.strokeDasharray=df; flat.style.strokeDashoffset=(df*(1-uf)).toFixed(2);
   /* each label rides the head of its own line */
   const jy=(()=>{                       // height at the drawn head
     const t=uj*(JAGY.length-1), i=Math.min(JAGY.length-2,Math.floor(t));
     return lerp(JAGY[i],JAGY[i+1],t-i);
   })();
   /* the labels ride the head of each line, so near the right edge they
      would be centred on a point that is already off-frame — keep the whole
      label inside the viewport instead */
   const hold=(el,lx)=>{
     const half=el.offsetWidth/2, m=8;
     return Math.max(half+m, Math.min(w-half-m, lx));
   };
   px(l1,{left:hold(l1,cl+cwid*uj).toFixed(1)+'px',top:(ct+chgt*jy).toFixed(1)+'px',
     opacity:(eo3(P(p,.30,.14))*(1-eo3(P(p,.985,.05)))).toFixed(3),
     transform:'translate(-50%,-150%)'});
   px(l2,{left:hold(l2,cl+cwid*uf).toFixed(1)+'px',top:(ct+chgt*FLATY).toFixed(1)+'px',
     opacity:(eo3(P(p,.62,.14))*(1-eo3(P(p,.985,.05)))).toFixed(3),
     transform:'translate(-50%,90%)'});
 };
}

/* ═══ S6 · the one-line diff ════════════════════════════════════════
   Not a file typing itself out — a diff. The old line strikes through
   and the new one is written under it. */
const DIFF=[
 ['c','# your existing code'],
 ['','client = OpenAI('],
 ['','    api_key  = "…",'],
 ['-','    base_url = "https://api.openai.com/v1"'],
 ['+','    base_url = "https://you.cloud.digitaloman.ai/v1"'],
 ['',')'],
 ['',''],
 ['c','# everything below is unchanged'],
 ['','resp = client.chat.completions.create('],
 ['','    model    = "your-model",'],
 ['','    messages = [{"role": "user", "content": "Marhaba"}],'],
 ['',')'],
];
{
 const s=sec(300), st=s.stage;
 E('div','paperbg',st); const fog=E('div','fog',st);
 const headBox=E('div','',st);
 px(headBox,{position:'absolute',left:'0',right:'0',top:'16%',height:'0'});
 const a=line(headBox,'Change *one line*.','t-hero');
 const tm=E('div','term',st);
 const bar=E('div','bar',tm);
 ['#ff5f57','#febc2e','#28c840'].forEach(c=>{const d=E('div','dot',bar);d.style.background=c;});
 E('div','ttl',bar,'openai-compatible');
 const body=E('div','body',tm,'');
 const foot=E('div','kick',st,'the SDKs you already use, pointed somewhere else');
 px(foot,{position:'absolute',left:'0',right:'0',bottom:'7%',textAlign:'center',
   color:'var(--ink-soft)',letterSpacing:'.2em',willChange:'opacity'});
 const paint=(txt)=>{
   const esc=txt.replace(/&/g,'&amp;').replace(/</g,'&lt;');
   return esc.replace(/(#.*$)|("[^"]*")|\b(client|resp|OpenAI)\b/g,
     (m,c,q,fn)=> c ? '<span class="c">'+c+'</span>'
                : q ? '<span class="s">'+q+'</span>'
                    : '<span class="f">'+fn+'</span>');
 };
 s.draw=p=>{
   const w=VW(), h=VH(), nb=NARROW();
   const tw=Math.min(w*(nb?.94:.80),1140);
   px(tm,{left:((w-tw)/2)+'px',top:(h*(nb?.27:.30))+'px',width:tw+'px'});
   /* `white-space:pre` clips rather than wraps, so the widest line is
      solved for using the face's measured advance */
   let maxCh=0; for(const l of DIFF) maxCh=Math.max(maxCh,l[1].length);
   const pad=Math.max(16,Math.min(34,w*.021))*2;
   const fs=Math.max(8,Math.min(nb?14:19,(tw-pad)/(maxCh*advance())));
   px(body,{fontSize:fs.toFixed(2)+'px',
     padding:`${Math.max(13,Math.min(28,h*.024)).toFixed(0)}px ${(pad/2).toFixed(0)}px`});
   show(a,p,.03,.05,.18,{out:.985,outDur:.05});
   const u=eo5(P(p,.16,.30));
   px(tm,{opacity:(eo3(P(p,.16,.18))*(1-eo3(P(p,.985,.05)))).toFixed(3),
     transform:`translateY(${((1-u)*44).toFixed(1)}px) scale(${lerp(.96,1,u).toFixed(3)})`});
   /* context first, then the old line is struck out, then the new one lands */
   const ctx=P(p,.26,.26), strike=P(p,.56,.14), add=P(p,.66,.22);
   const html=[];
   let ctxSeen=0, ctxTotal=0;
   for(const [k,t] of DIFF) if(k!=='-'&&k!=='+') ctxTotal+=t.length+1;
   for(const [k,t] of DIFF){
     if(k==='-'){
       const on=strike>0;
       html.push(on?`<span class="del" style="text-decoration-color:rgba(185,69,95,${strike.toFixed(2)})">${paint(t)}</span>`
                   :paint(t));
     }else if(k==='+'){
       const n=Math.floor(add*t.length);
       html.push(n>0?`<span class="add">${paint(t.slice(0,n))}</span>`
                    +(n<t.length?'<span class="cur"></span>':''):'');
     }else{
       const take=clamp(Math.floor(ctx*ctxTotal)-ctxSeen,0,t.length);
       html.push(paint(t.slice(0,take)));
       ctxSeen+=t.length+1;
     }
   }
   body.innerHTML=html.join('\n');
   foot.style.opacity=(eo3(P(p,.84,.12))*(1-eo3(P(p,.985,.05)))*.95).toFixed(3);
   px(fog,{opacity:'.5',transform:`translateY(${lerp(10,-6,p).toFixed(1)}vh)`});
 };
}

/* JetBrains Mono advances a fixed fraction of its em; measure it once so
   the code card can be fitted to any frame without guessing. */
let _adv=0;
function advance(){
  if(_adv) return _adv;
  const p=E('span','mono',document.body,'0'.repeat(100));
  px(p,{position:'absolute',left:'-9999px',top:'0',fontSize:'100px',whiteSpace:'pre'});
  const w=p.getBoundingClientRect().width; p.remove();
  _adv = w>0 ? (w/100)/100 : 0.6;
  return _adv;
}
/* ═══ driver ═══════════════════════════════════════════════════════ */
const prog=document.getElementById('prog');
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
let target=0, cur=0, ready=false;

/* One continuous timeline: T = section index + that section's progress.
   Stages are fixed and cross-dissolve across the seam, so a section hands
   over to the next the way a cut does — nothing slides out of frame. */
function globalT(y){
  const last=SEC.length-1;
  for(let i=0;i<SEC.length;i++){
    const s=SEC[i], top=s.el.offsetTop;
    /* the final section is the only one with nothing after it, so its last
       viewport-worth of height is unreachable — measure it against what can
       actually be scrolled, or it never reaches p = 1 */
    const h=Math.max(1, i===last ? s.el.offsetHeight-VH() : s.el.offsetHeight);
    if(y<top) return i;
    if(y<top+h) return i+(y-top)/h;
  }
  return SEC.length-1e-4;
}
function draw(){
  const y=cur, vh=VH(), T=globalT(y), last=SEC.length-1;
  for(let i=0;i<SEC.length;i++){
    const s=SEC[i];
    const inn = i===0 ? 1 : P(T,i-.055,.075);
    const out = i===last ? 0 : P(T,i+.985,.070);
    const vis = Math.min(inn,1-out);
    if(vis<=.003){ s.stage.style.display='none'; continue; }
    s.stage.style.display='';
    s.stage.style.opacity=vis.toFixed(3);
    s.draw(clamp(T-i));
  }
  const max=Math.max(1,document.documentElement.scrollHeight-vh);
  prog.style.width=(clamp(y/max)*100).toFixed(2)+'%';
}
/* the shorter runway spends more timeline per pixel, so on touch the easing
   has to sit closer to the finger or the film visibly trails the swipe */
const FOLLOW = TOUCH ? .26 : .16;
function tick(){
  if(ready){
    cur += (target-cur)*(REDUCED?1:FOLLOW);
    if(Math.abs(target-cur)<.35) cur=target;
    draw();
  }
  requestAnimationFrame(tick);
}
let layoutW=0, layoutH=0;
function relayout(){ measureAll(); cur=target=window.scrollY; draw(); }

addEventListener('scroll',()=>{ target=window.scrollY; },{passive:true});
let rt; addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>{
  const w=VW(), h=VH();
  if(w!==layoutW || Math.abs(h-layoutH)>layoutH*.35) relayout();
  else { layoutH=h; draw(); }                     // address-bar churn: just redraw
},140); });
addEventListener('orientationchange',()=>{ clearTimeout(rt); rt=setTimeout(relayout,220); });

(async () => {
  const urls=new Set();
  document.querySelectorAll('img').forEach(i=>urls.add(i.getAttribute('src')));
  urls.add(IMG('mark'));
  for(const n of ['coast','silk','hall','dunes','desk','fort']) urls.add(CL(n));
  await Promise.all([...urls].map(u=>new Promise(r=>{
    const i=new Image(); i.onload=i.onerror=r; i.src=u;
  })));
  try{ await document.fonts.ready; }catch(e){}
  ready=true; relayout();
  document.body.dataset.ready='1';
})();
tick();
